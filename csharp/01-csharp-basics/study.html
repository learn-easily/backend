<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ლექციები</title>
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#1e2132;--muted:#7b8096;--line:#e6dfd2;--accent:#6d28d9;--red:#dc2626}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans Georgian","DejaVu Sans",system-ui,sans-serif}
#gate{visibility:hidden;width:min(380px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:0 12px 40px rgba(30,33,50,.08);text-align:center}
#gate.on{visibility:visible}
.lock{font-size:42px;line-height:1}
h1{font-size:24px;margin:12px 0 4px}
p{color:var(--muted);margin:0 0 20px;font-size:15px}
input{width:100%;font:600 18px ui-monospace,"JetBrains Mono",monospace;letter-spacing:.06em;text-align:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none;background:var(--bg);color:var(--ink)}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #f3effe}
button{width:100%;margin-top:12px;font:700 16px inherit;font-family:inherit;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:14px;min-height:21px;margin-top:10px}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head>
<body>
<form id="gate" autocomplete="off">
  <div class="lock">🔒</div>
  <h1>ლექციები</h1>
  <p>შესასვლელად შეიყვანე კოდი</p>
  <input id="code" type="password" placeholder="კოდი" aria-label="კოდი">
  <button id="go" type="submit">გახსნა</button>
  <div class="err" id="err"></div>
</form>

const KEY = 'lectures:code';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(code) {
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(D.s), iterations: D.n, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.i) }, key, b64(D.c)));
    try { localStorage.setItem(KEY, code); } catch (e) {}
    document.open(); document.write(html); document.close();
    return true;
  } catch (e) { return false; }
}
const gate = document.getElementById('gate'), input = document.getElementById('code'), err = document.getElementById('err'), go = document.getElementById('go');
function showGate() { gate.classList.add('on'); input.focus(); }
gate.addEventListener('submit', async e => {
  e.preventDefault();
  const code = input.value.trim(); if (!code) return;
  go.disabled = true; err.textContent = '';
  if (!(await unlock(code))) {
    go.disabled = false; err.textContent = 'კოდი არასწორია';
    gate.classList.remove('shake'); void gate.offsetWidth; gate.classList.add('shake'); input.select();
  }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved && await unlock(saved)) return;
  if (saved) { try { localStorage.removeItem(KEY); } catch (e) {} }   // the code was changed
  showGate();
})();
