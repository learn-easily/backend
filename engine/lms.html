<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>💻 {{TITLE}}</title>
{{FONTS}}{{THEME}}
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2132;--ink2:#3b3f54;--muted:#7b8096;--line:#e4ddcf;--line2:#d6cdbb;
  --accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;--green:#15803d;--soft:#f1ece3;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top a{font:600 14px var(--mono);color:var(--muted);text-decoration:none}
.top a:hover{color:var(--ink)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:980px;margin:0 auto;padding:28px 20px 120px}
.k{font:600 14px var(--mono);color:var(--accent)}
h1{font-size:32px;line-height:1.25;margin:6px 0 22px}
h2{font-size:23px;margin:40px 0 10px;padding-top:12px;border-top:4px solid var(--accent)}
h3{font-size:18px;margin:26px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 20px;margin:12px 0}
.box h3{margin:0 0 6px}
.box ul{margin:0;padding-left:20px}
code{font:600 .86em var(--mono);background:var(--soft);border-radius:6px;padding:1px 6px}
.toc{columns:2;column-gap:24px;font:600 14px/1.9 var(--mono);margin:8px 0}
.toc a{text-decoration:none;color:var(--ink2)}.toc a:hover{color:var(--accent)}
.tag{display:inline-block;font:700 11px var(--mono);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:1px}
.tag.new{background:#dcfce7;color:#166534}.tag.mod{background:#fef3c7;color:#92400e}.tag.del{background:#fee2e2;color:#991b1b}
.codebox{margin:12px 0 22px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffdf9;scroll-margin-top:70px}
.codebox .ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px;font:600 13px var(--mono);color:var(--ink2);background:#f6f1e8;border-bottom:1px solid var(--line)}
.copy{font:600 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:7px;padding:3px 10px;cursor:pointer}
.copy:hover{border-color:var(--ink)}.copy.ok{color:var(--green);border-color:var(--green)}
.codebox pre.code{margin:0!important;padding:12px 0!important;overflow-x:auto;font:14px/1.65 var(--mono)!important;border:0!important;border-radius:0!important;background:#fffdf9!important;color:var(--ink);box-shadow:none!important}
main pre:not(.code){background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font:14px/1.6 var(--mono);overflow-x:auto}
main pre:not(.code) code{background:none;padding:0}
.codebox pre.code code{display:block;background:none;padding:0;border-radius:0;font:inherit}
pre.code .ln{display:block;padding:0 16px;white-space:pre}
pre.code .ln.add{background:#ecfdf3;box-shadow:inset 3px 0 0 #16a34a}
.tree{font:14px/1.7 var(--mono);white-space:pre;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 18px;overflow-x:auto}
.legend{font:13px var(--mono);color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;background:#ecfdf3;box-shadow:inset 3px 0 0 #16a34a;vertical-align:-1px;margin-right:4px}
.empty{color:var(--muted);background:var(--card);border:1px dashed var(--line2);border-radius:14px;padding:20px;text-align:center}
{{TOKEN_CSS}}
@media print{.top,.copy{display:none}body{background:#fff}}
</style></head>
<body>
<div class="top"><a href="../syllabus.html#l-{{NUM}}">← სილაბუსი</a><div class="ttl">💻 {{TITLE}}</div>{{NAV}}{{THEME_BTN}}</div>
<main>
{{BODY}}
</main>
<script>
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy'); if (!btn) return;
  const text = [...btn.closest('.codebox').querySelectorAll('.ln')].map(l => l.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => { btn.classList.add('ok'); btn.textContent = '✓'; setTimeout(() => { btn.classList.remove('ok'); btn.textContent = 'კოპირება'; }, 1200); });
});
</script>
</body></html>
