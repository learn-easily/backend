<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📄 {{TITLE}} — სილაბუსი</title>
{{FONTS}}{{THEME}}
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2132;--ink2:#3b3f54;--muted:#7b8096;--line:#e4ddcf;--line2:#d6cdbb;
  --accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;--green:#15803d;--soft:#f1ece3;--code-ink:#6d28d9;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{font:600 14px var(--mono);color:var(--muted);text-decoration:none}
.top .back:hover{color:var(--ink)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:880px;margin:0 auto;padding:28px 20px 120px}
.k{font:600 14px var(--mono);color:var(--accent)}
h1{font-size:34px;line-height:1.2;margin:6px 0 18px}
h2{font-size:24px;margin:40px 0 4px;padding-top:14px;border-top:4px solid var(--accent)}
h3{font-size:18px;margin:0;line-height:1.4;flex:1;min-width:0}
h4{font-size:15px;margin:14px 0 2px;color:var(--ink)}
.lec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;scroll-margin-top:70px}
.lec.ready{border-left:4px solid var(--green)}
.lh{display:flex;align-items:center;gap:10px;padding:11px 14px 11px 16px;cursor:pointer;user-select:none;border-radius:14px}
.lh:hover h3{color:var(--accent)}
.lh:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.chev{flex:none;width:14px;font:700 18px/1 var(--mono);color:var(--muted);transition:transform .2s}
.lec.open .chev{transform:rotate(90deg);color:var(--accent)}
.pj{flex:none;font:600 12px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:1px 9px}
.lb{display:none;padding:0 18px 14px 40px;color:var(--ink2);font-size:16px}
.lec.open .lb{display:block}
.lb p{margin:4px 0 0}
.lb ul{margin:2px 0 0;padding-left:20px}.lb li{margin:2px 0}
.mw{position:relative;flex:none}
.more{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;width:32px;height:28px;border-radius:8px;
  border:1px solid var(--line2);background:var(--card);color:var(--ink2);font:700 18px/1 var(--sans);cursor:pointer}
.more:hover,.mw.on .more{border-color:var(--accent);color:var(--accent)}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:6;min-width:190px;background:var(--card);border:1px solid var(--line2);
  border-radius:12px;padding:6px;box-shadow:0 12px 30px -10px rgba(0,0,0,.25)}
.mw.on .menu{display:block}
.menu a{display:block;padding:8px 12px;border-radius:8px;font:600 14px var(--sans);color:var(--ink);text-decoration:none;white-space:nowrap}
.menu a:hover{background:var(--accent-soft);color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:15px;margin:12px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
th{background:var(--soft)}
code{font:600 .86em var(--mono);background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--code-ink)}
hr{display:none}
@media print{.top,.mw,.chev{display:none}body{background:#fff}.lb{display:block}}
</style></head>
<body>
<div class="top">
  <a class="back" href="../">← ლექციები</a>
  <div class="ttl">📄 სილაბუსი · {{TITLE}}</div>
  {{THEME_BTN}}
</div>
<main>
<div class="k">📄 სილაბუსი · {{COUNT}} ლექცია</div>
{{BODY}}
</main>
<script>
// ლექცია: სათაურზე დაჭერა ხსნის აღწერას (ერთდროულად მხოლოდ ერთი); ⋯ — ბმულების მენიუ
const closeMenus = except => document.querySelectorAll('.mw.on').forEach(w => w !== except && w.classList.remove('on'));
function openLec(lec, scroll) {
  const was = lec.classList.contains('open');
  document.querySelectorAll('.lec.open').forEach(l => l.classList.remove('open'));
  if (!was) { lec.classList.add('open'); if (scroll) lec.scrollIntoView({ block: 'start' }); }
}
document.addEventListener('click', e => {
  const more = e.target.closest('.more');
  if (more) { const w = more.parentElement; closeMenus(w); w.classList.toggle('on'); return; }
  if (e.target.closest('.menu')) return;
  closeMenus();
  const lh = e.target.closest('.lh'); if (lh) openLec(lh.parentElement);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeMenus();
  const lh = e.target.closest && e.target.closest('.lh');
  if (lh && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openLec(lh.parentElement); }
});
const fromHash = () => { const l = document.getElementById(location.hash.slice(1)); if (l && l.classList.contains('lec') && !l.classList.contains('open')) openLec(l, true); };
fromHash(); addEventListener('hashchange', fromHash);
</script>
</body></html>
