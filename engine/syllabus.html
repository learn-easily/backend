<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>📄 {{TITLE}} — სილაბუსი</title>
{{FONTS}}{{THEME}}
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2132;--ink2:#3b3f54;--muted:#7b8096;--line:#e4ddcf;--line2:#d6cdbb;
  --accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;--green:#15803d;--soft:#f1ece3;--code-ink:#6d28d9;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
</style>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 20px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{font:600 14px var(--mono);color:var(--muted);text-decoration:none}
.top .back:hover{color:var(--ink)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:880px;margin:0 auto;padding:28px 20px 120px}
.k{font:600 14px var(--mono);color:var(--accent)}
h1{font-size:34px;line-height:1.2;margin:6px 0 18px}
h2{font-size:24px;margin:40px 0 4px;padding-top:14px;border-top:4px solid var(--accent)}
h3{font-size:19px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.lec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:12px 0}
.lec p{margin:6px 0 0;color:var(--ink2);font-size:16px}
.lec.ready{border-left:4px solid var(--green)}
.go{display:inline-flex;gap:8px;margin-left:auto}
.go a{font:600 12.5px var(--mono);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:2px 10px;background:var(--card)}
.go a:hover{border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:15px;margin:12px 0;display:block;overflow-x:auto}
th,td{border:1px solid var(--line);padding:7px 12px;text-align:left;vertical-align:top}
th{background:var(--soft)}
code{font:600 .86em var(--mono);background:var(--soft);border-radius:6px;padding:1px 6px;color:var(--code-ink)}
hr{display:none}
@media print{.top,.go{display:none}body{background:#fff}}
.lms{font:700 12.5px var(--mono);text-decoration:none;border:1.5px solid var(--accent);color:var(--accent);border-radius:999px;padding:1px 10px}
.lms:hover{background:var(--accent);color:var(--card)}
</style></head>
<body>
<div class="top">
  <a class="back" href="../">← ლექციები</a>
  <div class="ttl">📄 სილაბუსი · {{TITLE}}</div>
  {{THEME_BTN}}
</div>
<main>
<div class="k">📄 სილაბუსი · {{COUNT}} ლექცია</div>
{{BODY}}
</main>
</body></html>
