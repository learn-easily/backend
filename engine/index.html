<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ლექციები</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#1e2132;--muted:#7b8096;--line:#e6dfd2;--accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
main{max-width:980px;margin:0 auto;padding:40px 16px 80px}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.search{position:relative;flex:0 1 340px;min-width:220px}
.search input{width:100%;font:16px var(--sans);padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg)}
.last{display:none;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid #ddd2fb;border-radius:14px;padding:12px 16px;margin-bottom:28px;color:var(--ink);text-decoration:none}
.last.on{display:flex}
.last .lbl{font:700 12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.last .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last .go{margin-left:auto;font:700 14px var(--mono);color:var(--accent);white-space:nowrap}
.course{margin:0 0 34px}
.course h2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:22px;margin:0 0 12px}
.course h2 small{font:500 13px var(--mono);color:var(--muted)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:#fdfbf7}
.num{font:700 22px var(--mono);color:var(--accent)}
.title{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;display:block}
.title:hover{color:var(--accent)}
.meta{font:500 13px var(--mono);color:var(--muted);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap}
.meta details summary{cursor:pointer;color:var(--teal);list-style:none}.meta details summary::-webkit-details-marker{display:none}
.meta details[open]{flex-basis:100%}.meta details a{display:inline-block;margin:6px 12px 0 0;color:var(--teal);text-decoration:none}.meta details a:hover{text-decoration:underline}
.acts{display:flex;gap:8px}
.btn{font:700 14px var(--sans);text-decoration:none;border-radius:10px;padding:8px 14px;white-space:nowrap;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.btn:hover{border-color:var(--ink)}
.btn.play{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.play:hover{background:#5b21b6}
.empty{display:none;color:var(--muted);text-align:center;padding:40px 0}
.hidden{display:none!important}
footer{color:var(--muted);font-size:14px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
footer kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--card)}
@media (max-width:640px){
  h1{font-size:28px}.search{flex-basis:100%}
  .row{grid-template-columns:40px 1fr;padding:14px}
  .acts{grid-column:1/-1}.btn{flex:1;text-align:center}
}
</style></head>
<body><main>
<header>
  <div><h1>ლექციები</h1><div class="sub" id="sub"></div></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ძებნა — თემა, კურსი…" autocomplete="off"><kbd>/</kbd></label>
</header>
<a class="last" id="last"><span class="lbl">ბოლოს გახსნილი</span><span class="t"></span><span class="go">გაგრძელება →</span></a>
<div id="courses"></div>
<div class="empty" id="empty">ვერაფერი მოიძებნა</div>
<footer>პრეზენტაციაში: <kbd>F</kbd> სრული ეკრანი · <kbd>←</kbd> <kbd>→</kbd> ნავიგაცია · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd> ლექტორის ფანჯარა (Chrome/Edge) · <kbd>O</kbd> ყველა სლაიდი</footer>
</main>
<script>
const CATALOG = /*CATALOG*/[];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const total = CATALOG.reduce((n, c) => n + c.lectures.length, 0);
document.getElementById('sub').textContent = `${CATALOG.length} კურსი · ${total} ლექცია`;

document.getElementById('courses').innerHTML = CATALOG.map(c => `
  <section class="course" data-course="${esc(c.slug)}">
    <h2>${esc(c.title)}<small>${esc(c.audience)} · ${c.lectures.length} ლექცია</small></h2>
    <div class="list">${c.lectures.map(l => {
      const href = `${c.slug}/${l.slug}/`;
      const mats = l.materials.length ? `<details><summary>📎 მასალები · ${l.materials.length} ფაილი</summary>${l.materials.map(m => `<a href="${href}materials/${encodeURIComponent(m)}" download>${esc(m)}</a>`).join('')}</details>` : '';
      return `<div class="row" data-text="${esc((c.title + ' ' + l.title + ' ' + l.materials.join(' ')).toLowerCase())}">
        <div class="num">${String(l.num).padStart(2, '0')}</div>
        <div><a class="title" href="${href}" data-open="${esc(c.title)} · ${l.num} — ${esc(l.title)}">${esc(l.title)}</a>
          <div class="meta"><span>${l.slides} სლაიდი</span>${mats}</div></div>
        <div class="acts"><a class="btn play" href="${href}" data-open="${esc(c.title)} · ${l.num} — ${esc(l.title)}">▶ პრეზენტაცია</a><a class="btn" href="${href}script.html">📜 სცენარი</a></div>
      </div>`;
    }).join('')}</div>
  </section>`).join('');

// last opened (per-browser convenience only)
const lastEl = document.getElementById('last');
try {
  const last = JSON.parse(localStorage.getItem('lectures:last') || 'null');
  if (last && last.href) { lastEl.href = last.href; lastEl.querySelector('.t').textContent = last.title; lastEl.classList.add('on'); }
} catch (e) {}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-open]'); if (!a) return;
  try { localStorage.setItem('lectures:last', JSON.stringify({ href: a.getAttribute('href'), title: a.dataset.open })); } catch (e) {}
});

// search
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let any = 0;
  document.querySelectorAll('.course').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.row').forEach(r => { const hit = words.every(w => r.dataset.text.includes(w)); r.classList.toggle('hidden', !hit); n += hit; });
    sec.classList.toggle('hidden', !n); any += n;
  });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
  lastEl.classList.toggle('hidden', !!words.length);
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});
</script>
</body></html>
