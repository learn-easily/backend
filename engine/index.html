<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ლექციები</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8f3;--card:#fff;--ink:#1e2132;--muted:#7b8096;--line:#e6dfd2;--accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
main{max-width:1120px;margin:0 auto;padding:40px 16px 80px}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:6px;font-size:15px}
.search{position:relative;flex:0 1 340px;min-width:220px}
.search input{width:100%;font:16px var(--sans);padding:11px 14px 11px 40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 12px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--bg)}
.last{display:none;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid #ddd2fb;border-radius:14px;padding:12px 16px;margin-bottom:28px;color:var(--ink);text-decoration:none}
.last.on{display:flex}
.last .lbl{font:700 12px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.last .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.last .go{margin-left:auto;font:700 14px var(--mono);color:var(--accent);white-space:nowrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font:700 15px var(--sans);padding:9px 16px;border-radius:10px;color:var(--muted)}
.tab:hover{color:var(--ink);background:var(--bg)}
.tab.on{background:var(--c,var(--accent));color:#fff}
.tab .n{font:600 12px var(--mono);padding:1px 7px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.tab.none{opacity:.55}
.course{margin:0 0 46px}
.course>h2{display:flex;align-items:center;gap:12px;font-size:28px;margin:0 0 18px;font-weight:800}
.course>h2::before{content:"";width:6px;height:28px;border-radius:3px;background:var(--c)}
.course>h2 small{font:500 13px var(--mono);color:var(--muted)}
.course .soon{color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;
  transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(30,33,50,.04)}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(30,33,50,.08);border-color:#d6ccbb}
.card::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--accent))}
.card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.num{font:700 13px var(--mono);color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 10%,#fff);padding:3px 9px;border-radius:999px}
.slides{font:500 13px var(--mono);color:var(--muted)}
.title{font-weight:700;font-size:18px;line-height:1.35;color:var(--ink);text-decoration:none;flex:1;margin-bottom:14px}
.title::after{content:"";position:absolute;inset:0;border-radius:16px}
.card:hover .title{color:var(--c,var(--accent))}
.meta{position:relative;z-index:1;font:500 13px var(--mono);margin:-6px 0 12px}
.meta summary{cursor:pointer;color:var(--teal);list-style:none}.meta summary::-webkit-details-marker{display:none}
.meta details a{display:inline-block;margin:6px 10px 0 0;color:var(--teal);text-decoration:none}.meta details a:hover{text-decoration:underline}
.acts{position:relative;z-index:1;display:flex;gap:8px}
.btn{flex:1;text-align:center;font:700 14px var(--sans);text-decoration:none;border-radius:10px;padding:9px 12px;white-space:nowrap;border:1px solid var(--line);color:var(--ink);background:var(--card)}
.btn:hover{border-color:var(--ink)}
.btn.play{flex:1.6;background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.btn.play:hover{filter:brightness(.92)}
.empty{display:none;color:var(--muted);text-align:center;padding:40px 0}
.hidden{display:none!important}
footer{color:var(--muted);font-size:14px;margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
footer kbd{font:500 12px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;background:var(--card)}
@media (max-width:640px){
  h1{font-size:28px}.search{flex-basis:100%}
}
</style></head>
<body><main>
<header>
  <div><h1>ლექციები</h1><div class="sub" id="sub"></div></div>
  <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ძებნა — თემა, კურსი…" autocomplete="off"><kbd>/</kbd></label>
</header>
<a class="last" id="last"><span class="lbl">ბოლოს გახსნილი</span><span class="t"></span><span class="go">გაგრძელება →</span></a>
<nav class="tabs" id="tabs"></nav>
<div id="courses"></div>
<div class="empty" id="empty">ვერაფერი მოიძებნა</div>
<footer>პრეზენტაციაში: <kbd>F</kbd> სრული ეკრანი · <kbd>←</kbd> <kbd>→</kbd> ნავიგაცია · <kbd>P</kbd> კონსპექტი სლაიდებთან ერთად · <kbd>O</kbd> ყველა სლაიდი</footer>
</main>
<script>
const CATALOG = /*CATALOG*/[];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const total = CATALOG.reduce((n, c) => n + c.lectures.length, 0);
document.getElementById('sub').textContent = `${total} ლექცია`;

const COLORS = ['#6d28d9', '#0d9488', '#2563eb', '#d97706', '#db2777'];
const courses = CATALOG.map((c, i) => ({ ...c, color: COLORS[i % COLORS.length], count: c.lectures.length }));

const card = c => l => {
  const href = `${c.slug}/${l.slug}/`;
  const name = `${esc(c.title)} · ${l.num} — ${esc(l.title)}`;
  const mats = l.materials.length ? `<div class="meta"><details><summary>📎 მასალები · ${l.materials.length} ფაილი</summary>${l.materials.map(m => `<a href="${href}materials/${encodeURIComponent(m)}" download>${esc(m)}</a>`).join('')}</details></div>` : '';
  return `<article class="card" data-text="${esc((c.title + ' ' + l.title + ' ' + l.materials.join(' ')).toLowerCase())}">
    <div class="top"><span class="num">ლექცია ${l.num}</span><span class="slides">${l.slides} სლაიდი</span></div>
    <a class="title" href="${href}" data-open="${name}">${esc(l.title)}</a>
    ${mats}
    <div class="acts"><a class="btn play" href="${href}" data-open="${name}">▶ პრეზენტაცია</a>${l.study ? `<a class="btn" href="${href}study.html">📖 კონსპექტი</a>` : ``}</div>
  </article>`;
};
document.getElementById('courses').innerHTML = courses.map(c => `
  <section class="course" data-cat="${esc(c.slug)}" style="--c:${c.color}">
    <h2>${esc(c.title)}<small>${c.count} ლექცია</small></h2>
    ${c.count ? `<div class="grid">${c.lectures.map(card(c)).join('')}</div>` : `<div class="soon">ლექციები მალე დაემატება</div>`}
  </section>`).join('');

// category tabs — the choice lives in the URL (#devops), so a category can be linked directly
const tabs = document.getElementById('tabs');
tabs.innerHTML = [{ slug: '', title: 'ყველა', count: total, color: '' }, ...courses].map(k =>
  `<button class="tab${k.count ? '' : ' none'}" data-cat="${k.slug}" style="${k.color ? `--c:${k.color}` : ''}">${esc(k.title)}<span class="n">${k.count}</span></button>`).join('');
let cur = '';
function showCat(slug) {
  cur = courses.some(k => k.slug === slug) ? slug : '';
  tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.cat === cur));
  applyFilter();
}
tabs.addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return;
  history.replaceState(null, '', t.dataset.cat ? '#' + t.dataset.cat : location.pathname);
  showCat(t.dataset.cat);
});

// last opened (per-browser convenience only)
const lastEl = document.getElementById('last');
try {
  const last = JSON.parse(localStorage.getItem('lectures:last') || 'null');
  if (last && last.href) { lastEl.href = last.href; lastEl.querySelector('.t').textContent = last.title; lastEl.classList.add('on'); }
} catch (e) {}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-open]'); if (!a) return;
  try { localStorage.setItem('lectures:last', JSON.stringify({ href: a.getAttribute('href'), title: a.dataset.open })); } catch (e) {}
});

// search + category filter
const q = document.getElementById('q');
function applyFilter() {
  const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let any = 0;
  document.querySelectorAll('.course').forEach(sec => {
    const inCat = !cur || sec.dataset.cat === cur;
    let n = 0;
    sec.querySelectorAll('.card').forEach(r => { const hit = words.every(w => r.dataset.text.includes(w)); r.classList.toggle('hidden', !hit); n += hit; });
    // an empty course shows its "soon" note only when its own tab is picked
    const soon = !sec.querySelector('.card') && cur === sec.dataset.cat && !words.length;
    sec.classList.toggle('hidden', !inCat || !(n || soon));
    if (inCat) any += n || soon;
  });
  document.getElementById('empty').style.display = any ? 'none' : 'block';
  lastEl.classList.toggle('hidden', !!words.length);
}
q.addEventListener('input', applyFilter);
showCat(location.hash.slice(1));
addEventListener('hashchange', () => showCat(location.hash.slice(1)));
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});
</script>
</body></html>
