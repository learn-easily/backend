<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>აირჩიე შენი სფერო — ASP.NET Core Web API</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2335;--ink2:#475569;--muted:#94a3b8;--line:#e5e2da;--core:#0d9488;--net:#4f46e5;--red:#dc2626;--amber:#d97706;--green:#16a34a;--r:16px;--font:"Noto Sans Georgian","Segoe UI",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font)}
a{color:var(--net)}
.wrap{max-width:1080px;margin:0 auto;padding:30px 20px 80px}
.kicker{font:700 13px var(--mono);color:var(--core);letter-spacing:.06em;text-transform:uppercase}
h1{margin:4px 0 6px;font-size:32px;line-height:1.25}
h2{font-size:22px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
h3{font-size:18px;margin:0 0 6px}
.lead{font-size:18px;color:var(--ink2);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin:18px 0;box-shadow:0 4px 18px rgba(31,35,53,.05)}
.how ol{margin:6px 0 0;padding-left:22px}.how li{margin:6px 0}
.mine{display:none;align-items:center;gap:12px;background:#f0fdf4;border:1px solid #86efac;border-radius:12px;padding:10px 16px;font-weight:700;color:#166534;margin:0 0 6px}
.mine.on{display:flex}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin-top:8px}
.dom{position:relative;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--a);border-radius:var(--r);padding:20px 20px 18px;box-shadow:0 4px 18px rgba(31,35,53,.06);cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none;color:inherit;display:flex;flex-direction:column}
.dom:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(31,35,53,.12)}
.dom .e{font-size:44px;line-height:1.1}
.dom h3{font-size:22px;margin:8px 0 0;color:var(--ink)}
.dom .brand{font:700 14px var(--mono);color:var(--a)}
.dom p{color:var(--ink2);margin:8px 0 12px;font-size:15px}
.dom .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tag{font:600 13px var(--mono);background:color-mix(in srgb,var(--a) 10%,#fff);color:var(--a);border-radius:7px;padding:2px 8px}
.badge{position:absolute;top:14px;right:14px;font:800 12px var(--mono);border-radius:999px;padding:3px 10px;background:#ede9fe;color:#5b21b6}
.badge.ok{background:#dcfce7;color:#166534}
.dom.example{background:repeating-linear-gradient(135deg,#fff,#fff 14px,#faf8ff 14px,#faf8ff 28px)}
/* detail */
.back{display:inline-block;margin-bottom:12px;font-weight:700;text-decoration:none}
.hero{border-top:8px solid var(--a)}
.hero .e{font-size:56px;line-height:1}
.hero .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.pick{margin-left:auto;border:0;background:var(--a);color:#fff;font:800 16px var(--font);border-radius:12px;padding:12px 20px;cursor:pointer}
.pick.done{background:#16a34a}
.note{background:#fffbeb;border:1px solid #fcd34d;border-radius:14px;padding:16px 20px;font-size:17px;line-height:1.85}
.who{font:700 13px var(--mono);color:#92400e;margin-bottom:4px}
.qa{display:flex;flex-direction:column;gap:10px}
.q{align-self:flex-end;max-width:82%;background:#eef2ff;border:1px solid #a5b4fc;color:#312e81;border-radius:14px;padding:8px 14px}
.a{align-self:flex-start;max-width:82%;background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;border-radius:14px;padding:8px 14px}
.q b,.a b{display:block;font:700 12px var(--mono);opacity:.7}
.actors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.actor{border:2px solid var(--c);border-radius:14px;padding:14px 16px;background:color-mix(in srgb,var(--c) 6%,#fff)}
.actor .t{font-size:20px;font-weight:800;color:var(--c)}
.actor code{font:700 14px var(--mono);color:var(--ink2)}
.actor ul{margin:6px 0 0;padding-left:20px}.actor li{font-size:15px;color:var(--ink2)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
th{font:700 12px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:#faf9f6}
td code,.mono{font:700 14px var(--mono);color:var(--core)}
td .lms{color:var(--ink2)}
tr.k td{background:#f0fdfa}
.lec{font:800 14px var(--mono);color:var(--net);white-space:nowrap}
.rule{display:grid;grid-template-columns:54px 1fr;border-bottom:1px solid var(--line)}
.rule div{padding:8px 10px}
.rule .r{font:800 15px var(--mono);color:var(--red);text-align:center}
details{border:1px dashed #cbd5e1;border-radius:12px;padding:10px 14px;background:#fcfcfb;margin-top:10px}
details summary{cursor:pointer;font-weight:800;color:var(--net)}
details[open] summary{margin-bottom:10px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--a);color:#fff;font:800 16px var(--mono)}
.steps b{color:var(--ink)}
.steps span{color:var(--ink2)}
.ex{margin-top:4px;font-size:14px;color:#6d28d9;background:#f5f3ff;border-radius:8px;padding:4px 10px;display:inline-block}
.ex code{color:#6d28d9}
.find{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 12px}
.find input{font:700 16px var(--mono);border:2px solid var(--net);border-radius:10px;padding:8px 12px;width:160px;text-transform:uppercase}
tr.hit td{background:#fef9c3 !important;outline:none}
tr.hit td:first-child{box-shadow:inset 5px 0 0 #ca8a04}
.id{font:800 14px var(--mono);color:#ca8a04;white-space:nowrap}
.out{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.out span{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px}
.warn{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;border-radius:12px;padding:12px 16px;font-weight:600}
.tip{background:#f0fdf4;border:1px solid #86efac;color:#166534;border-radius:12px;padding:12px 16px}
@media (max-width:720px){.q,.a{max-width:100%}table{font-size:13px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ---------------------------------------------------------------
   ყველა სფეროს ერთი და იგივე ჩონჩხი აქვს — ზუსტად ისეთი, როგორიც LMS-ს:
   catalog (კურსი) → container (ჯგუფი, ადგილებით) → membership (ჩარიცხვა)
   → schedule (ლექცია) → attendance (დასწრება) → deliverable (ნამუშევარი, დედლაინით)
   → rating (შეფასება) → completion (კურსის ჩაბარება). წესები R1–R8 — იგივე ნომრებით.
   --------------------------------------------------------------- */
const CONCEPTS = [
  ["catalog",    "კატალოგი",          "რას ვთავაზობთ"],
  ["container",  "ადგილებიანი ერთეული", "ვინ ერთად, რამდენი ადგილი"],
  ["membership", "ჩაწერა",            "ადამიანი ↔ ერთეული"],
  ["schedule",   "განრიგი",           "როდის · სად · ვინ"],
  ["attendance", "დასწრება",          "მოვიდა · დააგვიანა · არ მოვიდა"],
  ["deliverable","ფაილი დედლაინით",   "ატვირთვა + ვადა"],
  ["rating",     "შეფასება",          "ქულა — Value Object"],
  ["completion", "დასრულების წესი",   "როდის „დასრულდა წარმატებით“"]
];
const SHEET = "homework-sheet.html";
// [ID, ლექცია, თემა, f(domain)] — ერთი ლექცია = ერთი საშინაო = ერთი ID
const LECTURES = [
  ["HW-06", "06", "DDD: რა არის", () => "საერთო ყველასთვის (სფეროს ჯერ არ ირჩევ): LMS-ის ხედვა, ლექსიკონი, კითხვები"],
  ["HW-07", "07", "სფეროს აღმოჩენა", () => `ხედვა · ლექსიკონი · აქტორები · მოვლენები · წესები R1–R8 · რუკა · backlog — <a href="${SHEET}" target="_blank">📝 დაგეგმვის ფურცელში</a>`],
  ["HW-08", "08", "პროექტი + პირველი feature", d => `პროექტი <code>${d.id === "lms" ? "Lms" : d.brand}.Api</code> · ${d.catalog.ka} — <code>${d.catalog.code}</code> CRUD (R1) · <code>${d.actors[2].code}</code> და <code>${d.actors[1].code}</code> CRUD (R2)`],
  ["HW-09", "09", "Layers vs VSA · Minimal API", () => "ყველა არსებული feature → slice-ები · Controllers აღარ არის · Scalar"],
  ["HW-10", "10", "Rich entity + Value Object + Result", d => `${d.catalog.ka} და ადამიანები — rich entity · <code>Email</code> · <code>${d.container.code}</code> (${d.container.note}): Create + GetById`],
  ["HW-11", "11", "Aggregate + Concurrency", d => `${d.membership.ka} (<code>${d.membership.code}</code>) <code>${d.container.code}</code>-ის გავლით · ბოლო ადგილი → 409 · R3 · ${d.catalog.ka}ს წაშლა → 409`],
  ["HW-12", "12", "Middleware + Logging", () => "საკუთარი middleware: ყოველი მოთხოვნის ლოგი (მეთოდი, მისამართი, სტატუსი, დრო) · ILogger handler-ებში"],
  ["HW-13", "13", "შეცდომები და პასუხები", () => "ყველა შეცდომა ProblemDetails-ით · ErrorType · ResultExtensions (ToOk, ToCreated, ToNoContent) · global exception handler · try/catch აღარ არის handler-ებში"],
  ["HW-14", "14", "Authentication + Configuration", d => `ანგარიშები სამ როლზე (${d.actors.map(a => `<code>${a.code}</code>`).join(" · ")}) — ადამიანებს მენეჯერი ქმნის · პირველი მენეჯერი seed-ით · Argon2 · JWT · Options · user-secrets`],
  ["HW-15", "15", "Authorization", d => `როლები და policy-ები ყველა არსებულ endpoint-ზე · მიმდინარე მომხმარებელი handler-ში · R5: ${d.rules[4]}`],
  ["HW-16", "16", "ვალიდაცია + MediatR", () => "FluentValidation ყველა Create/Update request-ზე · slice-ები MediatR-ზე · ValidationBehavior"],
  ["HW-17", "17", "განრიგი + დასწრება", d => `${d.schedule.ka} — <code>${d.schedule.code}</code> · R4 · ${d.attendance.ka} — <code>${d.attendance.code}</code> · R6 · R5 · <code>${d.container.code}</code>-ის Repository · სია pagination-ით`],
  ["HW-18", "18", "ფაილები + დრო + შეფასება", d => `${d.deliverable.ka} — <code>${d.deliverable.code}</code> · <code>${d.rating.code}</code> · R7 · TimeProvider`],
  ["HW-19", "19", "Background jobs + დასრულება", d => `${d.reminder} · ${d.completion.ka} — R8`],
  ["HW-20", "20", "Angular + Claude Code #1", d => `Angular Claude Code-ით: შესვლა, layout, ${d.catalog.ka} და ${d.container.ka}`],
  ["HW-21", "21", "Angular + Claude Code #2", d => `Angular: ${d.schedule.ka}, ${d.attendance.ka}, ${d.deliverable.ka}, ${d.rating.ka} · frontend დასრულებულია`]

{

  tagline: "კურსები, ჯგუფები, ლექციები, დასწრება, დავალებები და შეფასება 1–12. ამას ლექტორი აწყობს კლასში.",
  owner: "აკადემიის დირექტორი",
  brief: "აკადემიაში რამდენიმე კურსი გვაქვს: ASP.NET, Angular, DevOps. ყოველ კურსს რამდენიმე ნაკადი გადის, დილის, საღამოს, ონლაინ. სტუდენტი კურსზე ირიცხება და ლექციებზე დადის. თუ ხშირად აცდენს, ლექტორმა უნდა იცოდეს. ლექტორი ყოველი ლექციის შემდეგ დავალებას აძლევს, დედლაინით. სტუდენტი დავალებას ფაილად ტვირთავს, ლექტორი აფასებს. ბოლოს ვიცით, ვინ ჩააბარა კურსი.",
  interview: [
    ["„კურსზე ჩაირიცხა“: ზუსტად სად ირიცხება?", "ფაქტობრივად, ჯგუფში. კურსი პროგრამაა, ჯგუფი კი ის ხალხია, ვინც მას ერთად გადის."],
    ["ჯგუფი სავსეა. მერე?", "20-ზე მეტი არ ეტევა. მენეჯერი ახალ ჯგუფს ხსნის."],
    ["„ხშირად აცდენს“: რამდენი?", "მე-4 გაცდენაზე ლექტორი იღებს შეტყობინებას. 15 წუთზე მეტი დაგვიანებაც გაცდენაა."],
    ["„ჩააბარა კურსი“ რას ნიშნავს?", "საშუალო ქულა ≥ 6 და დასწრება ≥ 75%."]
  ],
  actors: [
    {ka: "მენეჯერი", code: "Manager", c: "#d97706", does: ["ქმნის კურსებს და ჯგუფებს", "რიცხავს სტუდენტებს", "გეგმავს ლექციებს"]},
    {ka: "ლექტორი", code: "Lecturer", c: "#4f46e5", does: ["ატარებს ლექციებს", "აღრიცხავს დასწრებას", "აფასებს ნამუშევრებს"]},
    {ka: "სტუდენტი", code: "Student", c: "#16a34a", does: ["ხედავს განრიგს", "აბარებს ნამუშევრებს", "ხედავს ქულებს"]}

  catalog:    {ka: "კურსი", code: "Course"},

  schedule:   {ka: "ლექცია", code: "Lecture"},
  attendance: {ka: "დასწრება", code: "Attendance"},

  rating:     {ka: "შეფასება", code: "Grade", scale: "1–12"},

  rules: [
    "კურსის სახელი უნიკალურია",

    "ჯგუფში მაქსიმუმ 20 სტუდენტი · სტუდენტი ჯგუფში ერთხელ · დაწყებულ ჯგუფში — მხოლოდ პირველ კვირაში",

    "დასწრებას აღრიცხავს და აფასებს მხოლოდ ჯგუფის ლექტორი",
    "15 წთ-ზე მეტი დაგვიანება = გაცდენა · მე-4 გაცდენაზე ლექტორი იღებს შეტყობინებას",
    "დედლაინის შემდეგ ნამუშევარი არ მიიღება (მენეჯერს გადაწევა შეუძლია) · ქულა 1–12",

  out: ["გადახდები", "ხელშეკრულებები", "ჩატი"]
},
{
  id: "fitness", story1: "ადმინისტრატორი ქმნის პროგრამას", events: "პროგრამა შეიქმნა → ნაკადი გაიხსნა → წევრი ჩაეწერა → … → პროგრამა დასრულდა", e: "🏋️", name: "ფიტნეს-კლუბი", brand: "FitHub", color: "#ea580c",

      <li>სფეროს გვერდზე წაიკითხე <b>მფლობელის სიტყვები</b> და <b>ინტერვიუ</b>. შემდეგ DDD-ით დაგეგმე პროექტი: ხედვა, ლექსიკონი, აქტორები, მოვლენები, წესები, რუკა, backlog.</li>
      <li><b>ყოველი ლექციის საშინაო</b> = იგივე თემა შენს სფეროში. ლექტორი LB-ზე საშინაოს <b>ID</b>-ს მოგცემს (მაგ. <code>HW-08</code>). სფეროს გვერდზე ამ ID-ს ცხრილში იპოვი და ნახავ, რა გააკეთო.</li>
      <li>⚠️ <b>ლექციას წინ ნუ გაუსწრებ.</b> მხოლოდ ის დავალება გააკეთე, რომლის ID-იც უკვე მიიღე. შემდეგი თემა ჯერ არ გისწავლია, და თუ წინ გაიქცევი, მერე კოდის თავიდან გადაწერა მოგიწევს.</li>
      <li>სფეროს ბოლომდე არ ცვლი: ერთი პროექტი, კურსის დასაწყისიდან ბოლომდე.</li>
    </ol>
  </div>
  <div class="grid">
    ${DOMAINS.map(d => `
    <a class="dom ${d.example ? "example" : ""}" href="#${d.id}" style="--a:${d.color}">
      ${d.example ? `<span class="badge">ლექტორის მაგალითი</span>` : (d.id === getMine() ? `<span class="badge ok">✓ შენი</span>` : "")}
      <div class="e">${d.e}</div>
      <div class="brand">${d.brand}</div>
      <h3>${d.name}</h3>
      <p>${d.tagline}</p>
      <div class="tags">${[d.catalog, d.container, d.schedule, d.rating].map(c => `<span class="tag">${c.code}</span>`).join("")}</div>
    </a>`).join("")}
  </div>`;
  window.scrollTo(0, 0);
}

function detail(d){
  document.title = `${d.name} — ${d.brand}`;
  const mine = getMine() === d.id;
  const lms = DOMAINS[0];
  app.innerHTML = `
  <a class="back" href="#">← ყველა სფერო</a>
  <div class="card hero" style="--a:${d.color}">
    <div class="row">
      <div class="e">${d.e}</div>
      <div><div class="kicker" style="color:${d.color}">${d.brand}${d.example ? " · ლექტორის მაგალითი" : ""}</div><h1>${d.name}</h1></div>
      ${d.example ? "" : `<button class="pick ${mine ? "done" : ""}" id="pick" style="--a:${d.color}">${mine ? "✓ ეს ჩემი სფეროა" : "ამას ვირჩევ"}</button>`}
    </div>
    <p class="lead" style="margin:10px 0 0">${d.tagline}</p>
  </div>
  ${d.example ? `<div class="warn">ამას ლექტორი აწყობს კლასში, ის მხოლოდ მაგალითია. შენ <a href="#">აირჩიე სხვა სფერო</a> და იგივე გზა შენით გაიარე.</div>` : ""}

  <div class="card">
    <h2>📄 მფლობელის სიტყვები</h2>
    <p style="margin:0 0 10px;color:var(--ink2)">ასე ლაპარაკობს ბიზნესი: ბუნდოვნად, სინონიმებით, წესები კი შუა წინადადებაშია დამალული. წაიკითხე ორჯერ, როგორც 06 ლექციაზე.</p>
    <div class="note"><div class="who">${d.owner}:</div>„${d.brief}“</div>
  </div>

  <div class="card">
    <h2>💬 ინტერვიუ: დაზუსტებული კითხვები</h2>
    <div class="qa">${d.interview.map(([q, a]) => `<div class="q"><b>დეველოპერი</b>${q}</div><div class="a"><b>${d.owner.split(",")[0]}</b>${a}</div>`).join("")}</div>
  </div>

  <div class="card">
    <h2>🧑‍🤝‍🧑 აქტორები</h2>
    <div class="actors">${d.actors.map(a => `<div class="actor" style="--c:${a.c}"><div class="t">${a.ka}</div><code>${a.code}</code><ul>${a.does.map(x => `<li>${x}</li>`).join("")}</ul></div>`).join("")}</div>
  </div>

  <div class="card" style="--a:${d.color}">
    <h2>🧭 დაგეგმე DDD-ით</h2>
    <p style="margin:0 0 12px;color:var(--ink2)">დაგეგმვა ხდება <b>📝 დაგეგმვის ფურცელში</b> (HW-07). მას უკვე აქვს ეს სტრუქტურა: შეავსე ნაბიჯ-ნაბიჯ, ⬇ ჩამოტვირთე და ატვირთე LB-ზე. ფურცელი ბრაუზერში ინახება, ასე რომ როცა მომდევნო ლექციებზე ლექსიკონი ან წესები შეიცვლება, დაბრუნდი და განაახლე.</p>
    <a href="${SHEET}" target="_blank" style="display:inline-block;margin:0 0 16px;background:${d.color};color:#fff;font-weight:800;border-radius:12px;padding:10px 18px;text-decoration:none">📝 დაგეგმვის ფურცელი</a>
    <ol class="steps">
      <li><div><b>ხედვა</b> · <span>3–5 წინადადება: ვინ იყენებს, რა პრობლემას ხსნის, რა არ შედის.</span><div class="ex">LMS: „LMS აკადემიის სასწავლო ცხოვრებას ერთ ადგილას აგროვებს… გადახდები <b>არ</b> შედის.“</div></div></li>
      <li><div><b>ლექსიკონი</b> · <span>მფლობელის სიტყვებიდან და ინტერვიუდან ამოწერე ტერმინები. სინონიმები გააერთიანე, ბუნდოვანი სიტყვები გაყავი. ყოველ ტერმინს მიუწერე სახელი კოდში.</span><div class="ex">LMS: ჯგუფი — ვინ გადის კურსს ერთად, ერთი ლექტორით — <code>Group</code></div></div></li>
      <li><div><b>აქტორები</b> · <span>სამი როლი, მათი მიზანი და მოქმედებები (ზემოთ).</span><div class="ex">LMS: ლექტორი — მიზანი: ასწავლოს და შეაფასოს — ატარებს ლექციას, აფასებს</div></div></li>
      <li><div><b>მოვლენები</b> · <span>მთელი პროცესი წარსულ დროში, აქტორით, რიგით (12+): „${d.events}“.</span><div class="ex">LMS: მენეჯერი — სტუდენტი ჩაირიცხა</div></div></li>
      <li><div><b>წესები R1–R8</b> · <span>იპოვე ტექსტში თვითონ, მერე შეამოწმე ქვემოთ. ნომრები LMS-ის წესებს ემთხვევა: ყოველი ლექცია ერთსა და იმავე წესს ეხება.</span><div class="ex">LMS: R3 — ჯგუფში მაქსიმუმ 20 სტუდენტი · გამონაკლისი: დაწყებულში მხოლოდ პირველ კვირაში</div></div></li>
      <li><div><b>დომენის რუკა</b> · <span>ცნებები და კავშირები: <span class="mono">${d.catalog.code} → ${d.container.code} → ${d.membership.code} ← ${d.actors[2].code}</span> …</span><div class="ex">LMS: კურსი — 1 → ბევრი — ჯგუფი</div></div></li>
      <li><div><b>Backlog</b> · <span>15+ story რიგით. №1 ყოველთვის: „${d.story1}“ (R1).</span><div class="ex">LMS: №4 — როგორც მენეჯერი, მინდა ჩავრიცხო სტუდენტი ჯგუფში, რომ… — კრიტერიუმი: ადგილი უნდა იყოს — R3</div></div></li>
    </ol>
    <details><summary>🔒 შეამოწმე წესები (ჯერ თვითონ იპოვე!)</summary>
      ${d.rules.map((r, i) => `<div class="rule"><div class="r">R${i + 1}</div><div>${r}</div></div>`).join("")}
      <div style="margin-top:10px"><b>არ შედის:</b><div class="out">${d.out.map(o => `<span>${o}</span>`).join("")}</div></div>
    </details>
  </div>

  <div class="card">
    <h2>🔁 LMS ↔ ${d.name}: ცნებები</h2>
    <p style="margin:0 0 10px;color:var(--ink2)">ყოველ LMS-ის ცნებას შენს სფეროში თავისი წყვილი აქვს. ლექციაზე LMS-ს რომ ხედავ, აქ ნახე, რა არის ის შენთან.</p>
    <table><tr><th>ცნება</th><th>LMS</th><th>${d.name}</th></tr>
    ${CONCEPTS.map(([k, ka, hint]) => `<tr><td><b>${ka}</b><br><span style="color:var(--muted);font-size:13px">${hint}</span></td><td class="lms">${lms[k].ka}<br><code>${lms[k].code}</code>${lms[k].note ? `<br><small>${lms[k].note}</small>` : ""}${k === "rating" ? ` · ${lms.rating.scale}` : ""}</td><td><b>${d[k].ka}</b><br><code>${d[k].code}</code>${d[k].note ? `<br><small>${d[k].note}</small>` : ""}${k === "rating" ? ` · ${d.rating.scale}` : ""}</td></tr>`).join("")}
    <tr><td><b>როლები</b></td><td class="lms">${lms.actors.map(a => a.ka).join(" · ")}</td><td><b>${d.actors.map(a => a.ka).join(" · ")}</b></td></tr>
    </table>
  </div>

  <div class="card">
    <h2>🗓️ ლექცია → შენი საშინაო</h2>
    <div class="warn" style="margin:0 0 12px">⚠️ <b>ლექციას წინ ნუ გაუსწრებ!</b> გააკეთე მხოლოდ ის დავალება, რომლის <b>ID</b>-იც ლექტორმა LB-ზე მოგცა. შემდეგი თემა ჯერ არ გისწავლია. თუ წინ გაიქცევი, მერე თავიდან გადაწერა მოგიწევს.</div>
    <div class="find"><b>დავალების ID:</b><input id="hwid" placeholder="HW-08" maxlength="6"><span style="color:var(--ink2);font-size:14px">ჩაწერე LB-ზე მიღებული ID, და ის ქვემოთ მოინიშნება</span></div>
    <table><tr><th>ID</th><th>ლექცია</th><th>LMS-ში (კლასში)</th><th>${d.name} (სახლში)</th></tr>
    ${LECTURES.map(([id, n, t, f]) => `<tr data-id="${id}"><td class="id">${id}</td><td><span class="lec">${n}</span><br>${t}</td><td class="lms">${f(lms)}</td><td>${f(d)}</td></tr>`).join("")}
    </table>
  </div>

  ${d.example ? "" : `<div class="tip">💡 თუ რამე ბუნდოვანია და ინტერვიუში პასუხი არ წერია, ის <b>შენ</b> გადაწყვიტე, როგორც დეველოპერმა, რომელიც მფლობელს ეკითხება, და ჩაწერე ლექსიკონში ან წესებში. ერთ სფეროს რამდენიმე სტუდენტი სხვადასხვანაირად ააწყობს, და ეს ნორმალურია.</div>`}
  `;
  const inp = document.getElementById("hwid");
  const mark = v => {
    const id = (v || "").trim().toUpperCase().replace(/^HW-?/, "HW-").replace(/^(\d)/, "HW-$1");
    let hit = null;
    document.querySelectorAll("tr[data-id]").forEach(tr => { const on = !!id && tr.dataset.id === id.replace(/^HW-(\d)$/, "HW-0$1"); tr.classList.toggle("hit", on); if (on) hit = tr; });
    if (hit) hit.scrollIntoView({behavior: "smooth", block: "center"});
  };
  if (inp) { inp.oninput = () => mark(inp.value); const q = (location.hash.split("/")[1] || ""); if (q) { inp.value = q; setTimeout(() => mark(q), 50); } }
  const pick = document.getElementById("pick");
  if (pick) pick.onclick = () => { setMine(d.id); pick.textContent = "✓ ეს ჩემი სფეროა"; pick.classList.add("done"); };
  window.scrollTo(0, 0);
}

function route(){
  const id = location.hash.slice(1).split("/")[0];
  const d = DOMAINS.find(x => x.id === id);
  if (d) detail(d); else home();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
